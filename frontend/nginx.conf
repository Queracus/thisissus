server {
    listen 80;
    root /usr/share/nginx/html;
    client_max_body_size 60m;   # 50 MB videos + multipart overhead

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Real visitor IP for the PIN lockout: Cloudflare puts it in CF-Connecting-IP.
        proxy_set_header X-Forwarded-For $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-Proto https;
        proxy_request_buffering off;   # stream uploads straight to the API
        proxy_read_timeout 300s;
    }

    # The service worker must never be cached, or app updates get stuck.
    location = /sw.js { add_header Cache-Control "no-cache"; }
    location /assets/ { add_header Cache-Control "public, max-age=31536000, immutable"; }

    # SPA: every other path is the app.
    location / { try_files $uri /index.html; }
}
